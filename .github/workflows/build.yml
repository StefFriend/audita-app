name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle --no-daemon assembleDebug
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Audita.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Audita-apk
          path: Audita.apk
      - name: Publish as release "latest" (downloadable from the phone)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Audita.apk --title "Audita - latest build" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. Download Audita.apk on the phone and install it (allow apps from unknown sources)."
